name: on released published

on:
  release:
    types: [published]

jobs:
  test_windows:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install conda
      uses: s-weigand/setup-conda@v1
      with:
        update-conda: true
    
    - name: Verify conda installation
      run: |
        conda --version
        which python
    
    - name: Create conda environment
      run: |
        conda env create -f win_environment.yml
        conda env list

    # - name: install pyinstaller and NodeGraphQt
    #   run: |
    #     conda install -n FBSTUDIO -y -c conda-forge pyinstaller
    #     conda run -n FBSTUDIO pip install NodeGraphQt
      
    - name: Build project
      run: |
        cd pyinstaller
        conda run -n FBSTUDIO build.bat

    - name: Upload exe to Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./pyinstaller/dist/FretBurstStudio.exe
        asset_name: FretBurstStudio-Windows.exe
        asset_content_type: application/octet-stream
